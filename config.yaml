llm:
  provider: "openai"  # or "anthropic"
  model: "gpt-4"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.7
  max_tokens: 4000

agent:
  max_iterations: 10
  timeout_seconds: 300

memory:
  type: "sqlite"  # or "chromadb"
  db_path: "./memory/agent_memory.db"

file_generation:
  output_dir: "./generated_projects"
  default_framework: "nextjs"
  default_styling: "tailwindcss"

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
